syntax = "proto3";

package athena.v1;

import "athena/v1/state.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/danielpina1/athena/internal/pb/athenav1;athenav1";

// What a dashboard asks the server to do, and the answer.

message Command {
  string id = 1;
  oneof action {
    SubmitTask submit_task = 10;
    Reply reply = 11;
    Stop stop = 12;
    Retry retry = 13;
    Interrupt interrupt = 14;
    AnswerApproval answer_approval = 15;
    Reevaluate reevaluate = 16;
    Dismiss dismiss = 17;
    Unsubscribe unsubscribe = 18;
    SetPolicy set_policy = 19;
    WatchTicket watch_ticket = 20;
    UnwatchTicket unwatch_ticket = 21;
    PushSubscribe push_subscribe = 22;
    PushUnsubscribe push_unsubscribe = 23;
    SetNotificationPrefs set_notification_prefs = 24;
    Visibility visibility = 25;
    ListPasskeys list_passkeys = 26;
    RevokePasskey revoke_passkey = 27;
    GetPrompt get_prompt = 28;
    SetPrompt set_prompt = 29;
    ResetPrompt reset_prompt = 30;
    Pause pause = 31;
    Resume resume = 32;
    AllowAction allow_action = 33;
    DismissOffer dismiss_offer = 34;
    ApplyProposal apply_proposal = 35;
    DiscardProposal discard_proposal = 36;
    RetryElsewhere retry_elsewhere = 37;
    CreateNodeToken create_node_token = 38;
    SetNodeDraining set_node_draining = 39;
    RevokeNode revoke_node = 40;
    UpdateBreakdown update_breakdown = 41;
    ApproveBreakdown approve_breakdown = 42;
    RejectBreakdown reject_breakdown = 43;
    Replan replan = 44;
    ContinueWithout continue_without = 45;
  }
}

message SubmitTask {
  string text = 1;
  string repo = 2;
  string dir = 3;
  string model = 4;
  // runtime is claude, codex or auto; empty is the configured default. An unknown one is invalid.
  string runtime = 5;
  // review pairs the task with a review of its ready reports (true) or with none (false); unset is the Policy's
  // default.
  optional bool review = 6;
  // node is a node id to run the task on; empty means any.
  string node = 7;
  // plan_first holds the task while a planner drafts its split into child tickets, which the owner edits and approves
  // (or runs it as one ticket). It needs a repository or a folder that is a git repository.
  bool plan_first = 8;
}

// UpdateBreakdown replaces the sub-tasks of a plan-first Ticket's draft, when the draft is still at revision (the
// BreakdownView revision the owner edited); a draft that changed meanwhile is refused.
message UpdateBreakdown {
  string ticket_id = 1;
  uint32 revision = 2;
  repeated SubTaskView tasks = 3;
}

// ApproveBreakdown splits a plan-first Ticket into its draft's sub-tasks, when the draft is still at revision. It is not
// Sensitive: the children get the lead's Mandate and nothing more.
message ApproveBreakdown {
  string ticket_id = 1;
  uint32 revision = 2;
}

// RejectBreakdown runs a plan-first Ticket as one ticket, from a draft or a failed plan.
message RejectBreakdown {
  string ticket_id = 1;
}

// Replan asks the planner again for a plan-first Ticket's split, from a draft or a failed plan.
message Replan {
  string ticket_id = 1;
}

// ContinueWithout ends an open child ticket (ticket_id is the child) so its lead and the dependents that waited for it
// go on without it.
message ContinueWithout {
  string ticket_id = 1;
}

// RetryElsewhere retries a Ticket on a different node than the one it ran on.
message RetryElsewhere {
  string ticket_id = 1;
}

// CreateNodeToken makes a single-use join token for a new node; the result carries a NodeToken.
message CreateNodeToken {
  string name = 1;
  // ttl_seconds is the token's life; 0 is the default (1 h), at most 24 h.
  uint32 ttl_seconds = 2;
}

message SetNodeDraining {
  string node_id = 1;
  bool draining = 2;
}

message RevokeNode {
  string node_id = 1;
}

// NodeToken is the join command a CreateNodeToken answers with.
message NodeToken {
  string command = 1;
  google.protobuf.Timestamp expires_at = 2;
}

message Reply {
  string ticket_id = 1;
  string text = 2;
}

message Stop {
  string ticket_id = 1;
  string reason = 2;
}

message Retry {
  string ticket_id = 1;
}

message Interrupt {
  string ticket_id = 1;
}

message AnswerApproval {
  string approval_id = 1;
  bool approve = 2;
  string note = 3;
}

message Reevaluate {
  string trigger_id = 1;
}

message Pause {}

message Resume {}

message Dismiss {
  string decision_id = 1;
}

message Unsubscribe {
  string thread = 1;
}

message SetPolicy {
  uint32 base_revision = 1;
  string settings_json = 2;
}

message WatchTicket {
  string ticket_id = 1;
}

message UnwatchTicket {
  string ticket_id = 1;
}

message PushSubscribe {
  string endpoint = 1;
  string p256dh = 2;
  string auth = 3;
}

message PushUnsubscribe {
  string endpoint = 1;
}

message SetNotificationPrefs {
  repeated string muted = 1;
}

message Visibility {
  bool visible = 1;
}

message ListPasskeys {}

message RevokePasskey {
  string id = 1;
}

// GetPrompt asks for one prompt part with the assembled prompts and the part's history.
message GetPrompt {
  string part = 1;
}

// SetPrompt overrides a prompt part. base_revision is the PromptsView revision the owner edited from.
message SetPrompt {
  string part = 1;
  uint32 base_revision = 2;
  string text = 3;
}

// ResetPrompt returns a prompt part to its default.
message ResetPrompt {
  string part = 1;
  uint32 base_revision = 2;
}

// CommandResult answers a Command. code is one of the stable error codes when ok is false.
message CommandResult {
  string id = 1;
  bool ok = 2;
  string code = 3;
  string message = 4;
  oneof result {
    string ticket_id = 10;
    PasskeyList passkeys = 11;
    uint32 policy_revision = 12;
    PromptDetail prompt = 13;
    NodeToken node_token = 14;
  }
}

message PasskeyList {
  repeated Passkey passkeys = 1;
}

message Passkey {
  string id = 1;
  string name = 2;
  google.protobuf.Timestamp created_at = 3;
  google.protobuf.Timestamp last_used_at = 4;
}

// PromptDetail is one prompt part: its default, the owner's text, and the full prompts a new session would get.
message PromptDetail {
  string name = 1;
  string default_text = 2;
  // text is the override, empty when the part is not overridden.
  string text = 3;
  // previous_default_text is the default the override was saved against, set only when the default has since changed.
  string previous_default_text = 4;
  string full_worker = 5;
  string full_router = 6;
  // history holds the last 20 revisions of the part, newest first.
  repeated PromptRevision history = 7;
}

message PromptRevision {
  uint32 revision = 1;
  google.protobuf.Timestamp at = 2;
  string origin = 3;
  // reset is true when the revision returned the part to its default.
  bool reset = 4;
}

// AllowAction turns an offer into a standing allow rule in the Policy. It is Sensitive (needs a recent passkey).
message AllowAction {
  string class = 1;
}

// DismissOffer hides an offer until the owner has approved the class as many times again.
message DismissOffer {
  string class = 1;
}

// ApplyProposal lets a held reply, push or pull request go.
message ApplyProposal {
  string id = 1;
}

// DiscardProposal drops a held reply, push or pull request.
message DiscardProposal {
  string id = 1;
}
