syntax = "proto3";

package athena.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/danielpina1/athena/internal/pb/athenav1;athenav1";

// What a dashboard asks the server to do, and the answer.

message Command {
  string id = 1;
  oneof action {
    SubmitTask submit_task = 10;
    Reply reply = 11;
    Stop stop = 12;
    Retry retry = 13;
    Interrupt interrupt = 14;
    AnswerApproval answer_approval = 15;
    Reevaluate reevaluate = 16;
    Dismiss dismiss = 17;
    Unsubscribe unsubscribe = 18;
    SetPolicy set_policy = 19;
    WatchTicket watch_ticket = 20;
    UnwatchTicket unwatch_ticket = 21;
    PushSubscribe push_subscribe = 22;
    PushUnsubscribe push_unsubscribe = 23;
    SetNotificationPrefs set_notification_prefs = 24;
    Visibility visibility = 25;
    ListPasskeys list_passkeys = 26;
    RevokePasskey revoke_passkey = 27;
    GetPrompt get_prompt = 28;
    SetPrompt set_prompt = 29;
    ResetPrompt reset_prompt = 30;
  }
}

message SubmitTask {
  string text = 1;
  string repo = 2;
  string dir = 3;
  string model = 4;
  // runtime is claude, codex or auto; empty is the configured default. An unknown one is invalid.
  string runtime = 5;
  // review pairs the task with a review of its ready reports (true) or with none (false); unset is the Policy's
  // default.
  optional bool review = 6;
}

message Reply {
  string ticket_id = 1;
  string text = 2;
}

message Stop {
  string ticket_id = 1;
  string reason = 2;
}

message Retry {
  string ticket_id = 1;
}

message Interrupt {
  string ticket_id = 1;
}

message AnswerApproval {
  string approval_id = 1;
  bool approve = 2;
  string note = 3;
}

message Reevaluate {
  string trigger_id = 1;
}

message Dismiss {
  string decision_id = 1;
}

message Unsubscribe {
  string thread = 1;
}

message SetPolicy {
  uint32 base_revision = 1;
  string settings_json = 2;
}

message WatchTicket {
  string ticket_id = 1;
}

message UnwatchTicket {
  string ticket_id = 1;
}

message PushSubscribe {
  string endpoint = 1;
  string p256dh = 2;
  string auth = 3;
}

message PushUnsubscribe {
  string endpoint = 1;
}

message SetNotificationPrefs {
  repeated string muted = 1;
}

message Visibility {
  bool visible = 1;
}

message ListPasskeys {}

message RevokePasskey {
  string id = 1;
}

// GetPrompt asks for one prompt part with the assembled prompts and the part's history.
message GetPrompt {
  string part = 1;
}

// SetPrompt overrides a prompt part. base_revision is the PromptsView revision the owner edited from.
message SetPrompt {
  string part = 1;
  uint32 base_revision = 2;
  string text = 3;
}

// ResetPrompt returns a prompt part to its default.
message ResetPrompt {
  string part = 1;
  uint32 base_revision = 2;
}

// CommandResult answers a Command. code is one of the stable error codes when ok is false.
message CommandResult {
  string id = 1;
  bool ok = 2;
  string code = 3;
  string message = 4;
  oneof result {
    string ticket_id = 10;
    PasskeyList passkeys = 11;
    uint32 policy_revision = 12;
    PromptDetail prompt = 13;
  }
}

message PasskeyList {
  repeated Passkey passkeys = 1;
}

message Passkey {
  string id = 1;
  string name = 2;
  google.protobuf.Timestamp created_at = 3;
  google.protobuf.Timestamp last_used_at = 4;
}

// PromptDetail is one prompt part: its default, the owner's text, and the full prompts a new session would get.
message PromptDetail {
  string name = 1;
  string default_text = 2;
  // text is the override, empty when the part is not overridden.
  string text = 3;
  // previous_default_text is the default the override was saved against, set only when the default has since changed.
  string previous_default_text = 4;
  string full_worker = 5;
  string full_router = 6;
  // history holds the last 20 revisions of the part, newest first.
  repeated PromptRevision history = 7;
}

message PromptRevision {
  uint32 revision = 1;
  google.protobuf.Timestamp at = 2;
  string origin = 3;
  // reset is true when the revision returned the part to its default.
  bool reset = 4;
}
