syntax = "proto3";

package athena.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/danielpina1/athena/internal/pb/athenav1;athenav1";

// The state a dashboard shows: a Snapshot, then Deltas.

message Snapshot {
  uint64 cursor = 1;
  repeated TicketSummary tickets = 2;
  repeated ApprovalView approvals = 3;
  repeated TriggerView triggers = 4;
  repeated ThreadView threads = 5;
  repeated DecisionView decisions = 6;
  reserved 7;
  reserved "node";
  Health health = 8;
  PolicyView policy = 9;
  // repos are the repositories and folders a task can be placed in, the last used first.
  repeated RepoView repos = 10;
  NotificationPrefsView notifications = 11;
  PromptsView prompts = 12;
  Control control = 13;
  // offers are the actions the owner keeps approving, each offered as a standing allow rule.
  OfferList offers = 14;
  // proposals are the replies, pushes and pull requests Athena holds until the owner applies or discards them.
  repeated ProposalView proposals = 15;
  // nodes are the machines that run Tickets, the embedded one first.
  repeated NodeStatus nodes = 16;
}

message Delta {
  uint64 seq = 1;
  oneof change {
    TicketSummary ticket = 10;
    TicketDetail ticket_detail = 11;
    ApprovalView approval = 12;
    TriggerView trigger = 13;
    ThreadView thread = 14;
    DecisionView decision = 15;
    NodeStatus node = 16;
    Health health = 17;
    PolicyView policy = 18;
    // repos carries the whole list, sent only when it changed.
    RepoList repos = 19;
    NotificationPrefsView notifications = 20;
    PromptsView prompts = 21;
    Control control = 22;
    // offers carries the whole list, sent only when it changed.
    OfferList offers = 23;
    // proposal carries one Proposal in whatever state it now has; a client drops it from its pending list once it is
    // no longer pending.
    ProposalView proposal = 24;
    // node_removed is a node id a client drops from its list. Defined, sent by nothing yet: plan 6 defers
    // `athena node forget`.
    string node_removed = 25;
  }
}

// Control is the kill switch: while paused, Athena makes no decisions and sends no replies.
message Control {
  bool paused = 1;
  google.protobuf.Timestamp since = 2;
  // by is who paused it: cli or web.
  string by = 3;
}

// PromotionOffer is an action class (tool + rule + repository) the owner approved `approved` times in a row without a
// denial; allowing it writes a standing Policy allow rule.
message PromotionOffer {
  // class is the stable key: tool|rule|repo, lower-cased.
  string class = 1;
  string tool = 2;
  string rule = 3;
  string repo = 4;
  uint32 approved = 5;
}

message OfferList {
  repeated PromotionOffer offers = 1;
}

message TicketSummary {
  string id = 1;
  string title = 2;
  string stage = 3;
  string action = 4;
  string repo = 5;
  string dir = 6;
  string model = 7;
  google.protobuf.Timestamp created_at = 8;
  google.protobuf.Timestamp updated_at = 9;
  google.protobuf.Timestamp ended_at = 10;
  string outcome = 11;
  bool needs_you = 12;
  bool can_retry = 13;
  string pending_approval_id = 14;
  string pr_url = 15;
  string attention_question = 16;
  // branch is the worktree branch, athena/<lowercased id>; empty when the Ticket has no repository.
  string branch = 17;
  // runtime is the runtime of the latest Assignment that started (claude or codex), a review's included, so it shows
  // the reviewer's runtime while a review runs; else the Ticket's choice (runtime_choice: claude, codex or auto).
  string runtime = 18;
  // runtime_choice is what the Ticket asked for: claude, codex or auto.
  string runtime_choice = 19;
  // pairing is how the Ticket's work is paired: review, or empty for none.
  string pairing = 20;
  // review_rounds is how many reviews of its ready reports ended (approved, changes or failed).
  uint32 review_rounds = 21;
  // trust is the trust class of the sender the Ticket's Mandate was given on: owner, allowed, collaborator, stranger,
  // bot or ci.
  string trust = 22;
  // node_id and node_name are the node the latest Assignment runs on; empty before one is placed.
  string node_id = 23;
  string node_name = 24;
  // waiting_for_node is why the Ticket's Assignment is not placed yet ("Waiting for mac-studio", "Waiting for a node
  // with Codex"); empty when it is not waiting.
  string waiting_for_node = 25;
}

message TicketDetail {
  TicketSummary summary = 1;
  repeated TimelineEntry timeline = 2;
  repeated string threads = 3;
  // timeline_trimmed is set when the oldest timeline entries were dropped to fit one frame.
  bool timeline_trimmed = 4;
  // reports are the Ticket's Reports in full, one per Assignment that filed one, newest last: at most the last 5.
  repeated ReportView reports = 5;
}

message TimelineEntry {
  google.protobuf.Timestamp at = 1;
  // kind is trigger, decision, input, report, assignment, review, approval or reply.
  string kind = 2;
  // text is redacted, on one line and cut; Athena's hidden markers (<!-- athena:… -->) are removed.
  string text = 3;
  string ref_id = 4;
  // subkind refines kind, so a client can say what happened in plain words:
  //   trigger: where it came from: issue, pull, issue-comment, pull-comment, review-comment, review, ci or owner;
  //   decision: accepted;
  //   assignment: queued, started (the start entry), restart (its session was cut short by a server restart),
  //     resumed (it started again by itself), paused (the owner's pause parked its session at the end of a turn),
  //     unpaused (it started again after the pause), limited (it ended at a usage limit: subject is the runtime, text the
  //     RFC 3339 reset, empty when unknown), review (a review Assignment's start), or ended, interrupted, stopped
  //     or retried (the end entry, at the Assignment's end);
  //   review: approved, changes or failed, at the end of a review; text is the first finding line (or why it
  //     could not finish), subject the runtime that reviewed;
  //   report: the Report's state;
  //   input: trigger (a message from no person), text, note, resumed, context (seen on a Thread the Ticket only
  //     follows) or receipt (Athena's own acknowledgement on GitHub);
  //   reply: owner (from the dashboard) or github;
  //   approval: pending, approved, denied or expired.
  // Empty from an older server.
  string subkind = 5;
  // subject is what the entry is about, short: an Approval's tool and command (Bash: npm test), an Assignment's
  // model, a Report's pull request (PR #12), or the GitHub login of a reply.
  string subject = 6;
  // runtime is the runtime of the Assignment, set on assignment and review entries (claude or codex): the one it ran
  // on, or, for a queued Assignment pinned to one, the one it will run on; empty when it names none yet (an unpinned
  // queued Assignment, or a review that never started).
  string runtime = 7;
}

// ReportView is one Report in full.
message ReportView {
  string assignment_id = 1;
  // state is progress, waiting, ready, blocked, failed or dropped.
  string state = 2;
  // summary is the worker's text with its line breaks (Markdown), redacted, cut at 16 KiB.
  string summary = 3;
  // pull is the number of the pull request the Report named, 0 for none.
  uint32 pull = 4;
  // question is the Report's question for a person, if any.
  string question = 5;
  google.protobuf.Timestamp at = 6;
}

message ApprovalView {
  string id = 1;
  string ticket_id = 2;
  string tool = 3;
  string summary = 4;
  string rule = 5;
  string input_redacted = 6;
  string state = 7;
  google.protobuf.Timestamp created_at = 8;
  google.protobuf.Timestamp answered_at = 9;
}

// TriggerView is a Trigger in a list: no Meta, no Channel address, its text cut to one short line.
message TriggerView {
  string id = 1;
  google.protobuf.Timestamp at = 2;
  string source = 3;
  string actor = 4;
  string kind = 5;
  string addressed = 6;
  string thread = 7;
  string text = 8;
  // outcome says what became of it: filtered:<code>, reached/attached Tickets, requeued.
  string outcome = 9;
  // trust is the trust class the current Policy gives the sender: owner, allowed, collaborator, stranger, bot or ci;
  // empty while there is no Policy.
  string trust = 10;
}

message ThreadView {
  string key = 1;
  uint32 queued = 2;
  // eval is the Eval in progress.
  EvalView eval = 3;
  // tickets are the subscribed Tickets, each with its flags: T-0001(own,bound,context).
  repeated string tickets = 4;
  uint32 decisions = 5;
  string closed = 6;
}

message EvalView {
  string id = 1;
  string strength = 2;
  google.protobuf.Timestamp started_at = 3;
  google.protobuf.Timestamp delivered_at = 4;
}

// DecisionView is a Decision in the routing records.
message DecisionView {
  string id = 1;
  google.protobuf.Timestamp at = 2;
  string kind = 3;
  string thread = 4;
  string ticket_id = 5;
  repeated string triggers = 6;
  repeated Reason reasons = 7;
  bool would_accept = 8;
  // dismissed_at is unset while the Decision is not dismissed.
  google.protobuf.Timestamp dismissed_at = 9;
}

message Reason {
  string code = 1;
  map<string, string> values = 2;
}

message NodeStatus {
  string name = 1;
  uint32 slots = 2;
  uint32 slots_in_use = 3;
  repeated string live_ticket_ids = 4;
  uint32 queued = 5;
  // claude_version is kept for older clients; runtimes has it, and Codex, now.
  string claude_version = 6;
  // runtimes are the node's runtimes, sorted by name.
  repeated RuntimeStatus runtimes = 7;
  // id is the node's stable id; "local" for the embedded node for now.
  string id = 8;
  // state is online, offline, draining or revoked.
  string state = 9;
  google.protobuf.Timestamp last_seen = 10;
  string os = 11;
  string arch = 12;
  // local marks the node embedded in the server ("this machine").
  bool local = 13;
  string version = 14;
}

// QuotaWindow is one usage-limit window of a runtime.
message QuotaWindow {
  // name is the window's length (5h, 7d), prefixed by its bucket when the runtime has several.
  string name = 1;
  // used is the fraction used, 0 to 1.
  float used = 2;
  google.protobuf.Timestamp resets_at = 3;
  // stale: the window's reset passed since it was read, so used no longer holds.
  bool stale = 4;
}

// RuntimeStatus is one runtime of the node.
message RuntimeStatus {
  string name = 1;
  string version = 2;
  // ready: the node can start a session on it.
  bool ready = 3;
  // tested: its version is one Athena was verified against.
  bool tested = 4;
  // why says why it is not ready, or not tested; redacted, cut at 200 runes.
  string why = 5;
  repeated QuotaWindow windows = 6;
  // limited_until is when a limited runtime may work again; unset when it is not limited.
  google.protobuf.Timestamp limited_until = 7;
  // read_at is when the quota was last read.
  google.protobuf.Timestamp read_at = 8;
  // measured is false until a first quota reading came ("Not measured yet").
  bool measured = 9;
  // live is how many sessions run on it now.
  uint32 live = 10;
  // models are the models a task may pick on it, in the runtime's order; empty when none are known yet (not checked,
  // or not ready).
  repeated RuntimeModel models = 11;
}

// RuntimeModel is one model a runtime offers.
message RuntimeModel {
  // id is what the task sends as its model.
  string id = 1;
  // name is what the dashboard shows.
  string name = 2;
  // default marks the model a task that names none runs on (at most one).
  bool default = 3;
}

message Health {
  repeated HealthItem items = 1;
}

// HealthItem covers the Sources, the router, effects kinds, tls and push.
message HealthItem {
  string name = 1;
  bool ok = 2;
  string message = 3;
  google.protobuf.Timestamp since = 4;
}

// PolicyView carries the Policy as its canonical JSON; internal/policy stays its only schema.
message PolicyView {
  uint32 revision = 1;
  string version = 2;
  string settings_json = 3;
}

// RepoView is a place a task can run: a GitHub repository, a local git repository or a plain folder.
message RepoView {
  // name is owner/name for github, else an absolute path.
  string name = 1;
  // kind is github, git or dir.
  string kind = 2;
  // last_used_at is unset for a configured repository no Ticket has used.
  google.protobuf.Timestamp last_used_at = 3;
  // owed is how many things wait on the owner in this repository (Tickets in a person stage, plus Tickets with a
  // pending approval). Set for github repositories only.
  int32 owed = 4;
  // ceiling is how many things may wait on the owner here before Athena stops starting work it chose itself.
  int32 ceiling = 5;
  // braked is how many candidates the brake holds back in this repository.
  int32 braked = 6;
  // mode is live, or shadow when replies, pushes and pull requests are held for the owner. Empty for non-github kinds.
  string mode = 7;
}

// ProposalView is a reply, push or pull request held for the owner.
message ProposalView {
  string id = 1;
  string ticket_id = 2;
  string repo = 3;
  // kind is reply, push or pull_request.
  string kind = 4;
  // state is pending, applied, discarded, failed or superseded.
  string state = 5;
  string summary = 6;
  // detail is the held reply text, "branch @ sha7", or the pull request title and base.
  string detail = 7;
  google.protobuf.Timestamp created_at = 8;
  string error = 9;
}

message RepoList {
  repeated RepoView repos = 1;
}

// NotificationPrefsView says which push notification kinds exist and which the owner muted.
message NotificationPrefsView {
  repeated string kinds = 1;
  repeated string muted = 2;
}

// PromptsView says which prompt parts the owner overrode. Its revision is the base for SetPrompt and ResetPrompt.
message PromptsView {
  uint32 revision = 1;
  repeated PromptPartView parts = 2;
}

message PromptPartView {
  string name = 1;
  bool overridden = 2;
  // default_updated is true when the override was saved against a default that has since changed.
  bool default_updated = 3;
}
