<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Athena: enroll a device</title>
<script src="/app.js" defer></script>
</head>
<body data-page="enroll">
<main>
<h1>Enroll this device</h1>
<form id="enroll-form" hidden>
<p><label>Name of this passkey <input id="name" type="text" maxlength="64" autocomplete="off" value="Phone"></label></p>
<p><button type="submit">Create a passkey</button></p>
</form>
<p id="status"></p>
<p id="done" hidden><a href="/">Sign in</a></p>
</main>
</body>
</html>
